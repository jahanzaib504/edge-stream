
services:
  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./staticfiles:/app/staticfiles # Bind mount

