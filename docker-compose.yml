
services:
  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./staticfiles:/app/staticfiles # Bind mount

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - .env
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
   
volumes:
  postgres_data: